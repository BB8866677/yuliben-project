name: Deploy 游历本 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Set Vite base automatically
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "GITHUB_PAGES_BASE=/" >> "$GITHUB_ENV"
          else
            echo "GITHUB_PAGES_BASE=/$REPO_NAME/" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test source and basic functionality
        run: npm test
      - name: Build for GitHub Pages
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v5
